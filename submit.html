<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Submit a Bad Example | CBE</title><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="brand" href="index.html"><img src="assets/logo.png" alt="CBE home"></a><nav><a href="index.html">Home</a></nav></header><main class="inner"><a class="back" href="index.html">← BACK TO HOME</a><p class="eyebrow">SPILL IT</p><h1>SUBMIT A <em>BAD EXAMPLE.</em></h1><p>Tell us what happened, how you know, and where we can verify it. Please don't include private contact details about other people.</p><form id="story-form" class="form-grid"><label>What's the headline? *<input name="Story headline" required maxlength="160"></label><label>What happened? *<textarea name="What happened" required></textarea></label><label>Where did it happen? <input name="Location"></label><label>When did it happen? <input name="Date or approximate time"></label><label>Link to a reliable source or original post *<input name="Source URL" type="url" required></label><label>What makes this a Certified Bad Example? *<textarea name="Why it matters" required></textarea></label><label>Which category fits best?<select name="Category"><option>Bad judgment</option><option>Parenting</option><option>Social media chaos</option><option>Fraud or deception</option><option>The Good Stuff</option><option>Other</option></select></label><label>Your name or nickname *<input name="Submitter name" required></label><label>Your email (for follow-up) *<input name="Reply email" type="email" required></label><label>Can we credit you on air?<select name="Credit preference"><option>Yes, by name or nickname</option><option>No, keep me anonymous</option></select></label><label><span><input style="width:auto" type="checkbox" required> I confirm this is a good-faith submission and understand it may be discussed publicly.</span></label><button class="button" type="submit">PREPARE SUBMISSION ↗</button><p id="form-status" role="status"></p></form></main><script src="site-config.js"></script><script src="script.js"></script></body></html>
